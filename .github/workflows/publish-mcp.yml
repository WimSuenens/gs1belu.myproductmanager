name: Publish MCP server

# Triggers on either `mcp-upload-v*` / `mcp-download-v*` tag release-please derives
# for the `mcp-upload` and `mcp-download` components (see release-please-config.json,
# #82). One parameterized workflow instead of two near-duplicates: a `case $REF_NAME`
# step resolves which package directory/PyPI project the tag belongs to, then the
# rest of the job runs unparameterized against that resolved directory.
#
# The deprecated combined server (`mcp`, `gs1belu-mpm-mcp`) was retired in #87 after
# its final `0.4.0` cut: its release-please component and `mcp-v*` trigger are gone,
# so this workflow no longer publishes it. Its source stays in `mcp/combined/` (the
# archived-not-deleted PyPI package), but nothing re-publishes it.
#
# One job, two sequential OIDC-gated steps per publish — PyPI publish, then
# MCP-registry publish — so the registry step only runs if the PyPI publish it
# depends on actually succeeded (a step failure stops the job by default; there is no
# `needs:` between steps within one job, so keeping this a single job *is* the gate).
# The registry validates the `mcp-name` marker (each package's README) against the
# just-published PyPI JSON, so the order is load-bearing, not cosmetic.
#
# All three packages' pending PyPI trusted publishers bind to this exact filename
# (`publish-mcp.yml`) — renaming it breaks that trust relationship for all three.

on:
  push:
    tags:
      - 'mcp-upload-v*'
      - 'mcp-download-v*'

permissions:
  contents: read
  id-token: write # OIDC for both PyPI Trusted Publishing and the MCP registry's GitHub-OIDC auth.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: >-
        ${{
          startsWith(github.ref_name, 'mcp-upload-v') && 'https://pypi.org/p/gs1belu-mpm-upload-mcp' ||
          'https://pypi.org/p/gs1belu-mpm-download-mcp'
        }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Resolve package directory from the tag
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            mcp-upload-v*)
              echo "dir=mcp/upload" >> "$GITHUB_OUTPUT"
              ;;
            mcp-download-v*)
              echo "dir=mcp/download" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::publish-mcp: unrecognized tag '$REF_NAME' — no package directory mapping."
              exit 1
              ;;
          esac

      # hatch_build.py's CustomBuildHook copies these into the wheel/sdist at build
      # time (#70) — they must exist on disk before `uv build` runs, same as the `mcp`
      # job in ci.yml. Only mcp/upload actually consumes this (#75's Download server
      # bundles no spec), but building it unconditionally is simpler than a second
      # tag-based branch and costs nothing when unused.
      - name: Build effective specs (just gen-schemas)
        run: just gen-schemas

      - name: Build sdist + wheel
        run: uv build --project "${{ steps.resolve.outputs.dir }}" --out-dir "${{ steps.resolve.outputs.dir }}/dist"

      - name: Publish to PyPI (OIDC Trusted Publishing — pending publisher, keyless from v0.1.0)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ steps.resolve.outputs.dir }}/dist

      - name: Install mcp-publisher
        # Pinned like sdks/kiota.version — a floating `latest` would make CI
        # non-reproducible and let an upstream break land silently. Bump this
        # deliberately (reviewed diff), same discipline as the Kiota CLI pin.
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: ${{ github.workspace }}/mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: ${{ github.workspace }}/mcp-publisher publish
