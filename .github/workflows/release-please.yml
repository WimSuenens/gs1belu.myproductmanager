name: release-please

# Maintains the standing release PR (manifest mode, five packages — see
# release-please-config.json) and, when that PR is merged, pushes one
# `<component>-v<version>` tag per package that released. Runs on every push to
# `main`, not just merges of the release PR itself, so a normal feature-PR merge
# updates the standing release PR's pending bumps immediately.
#
# The tag push MUST use a short-lived GitHub App installation token, never the
# default GITHUB_TOKEN — GitHub's anti-recursion guard silently drops workflow
# triggers for tags/commits pushed by the default token, which would make a
# green release-PR merge publish nothing (#53).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a short-lived GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
