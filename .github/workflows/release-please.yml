name: release-please

# Maintains the standing release PR (manifest mode, five packages — see
# release-please-config.json) and, when that PR is merged, pushes one
# `<component>-v<version>` tag per package that released. Runs on every push to
# `main`, not just merges of the release PR itself, so a normal feature-PR merge
# updates the standing release PR's pending bumps immediately.
#
# The tag push MUST use a short-lived GitHub App installation token, never the
# default GITHUB_TOKEN — GitHub's anti-recursion guard silently drops workflow
# triggers for tags/commits pushed by the default token, which would make a
# green release-PR merge publish nothing (#53).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a short-lived GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      # Checkout with the app token so the uv.lock sync step below can push to
      # the release PR branch authenticated as the app (the default GITHUB_TOKEN
      # would work for a plain push here, but reusing the app identity keeps the
      # release PR's commits consistent — see the anti-recursion note above).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: release-please
        id: release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps mcp/pyproject.toml (+ server.json) but has no
      # concept of mcp/uv.lock, which pins the project's own version via its
      # `source = { editable = "." }` entry. Left alone, the lock drifts one
      # version behind and the next local `uv` run rewrites that line, producing
      # a phantom git diff. Re-lock on the release PR branch so the bump lands
      # atomically with pyproject.toml, in the same PR.
      - name: Install uv
        if: ${{ steps.release-please.outputs.pr }}
        uses: astral-sh/setup-uv@v5

      - name: Sync mcp/uv.lock on the release PR branch
        if: ${{ steps.release-please.outputs.pr }}
        env:
          # `pr` is an empty string on runs with no pending release PR (e.g. the
          # run that merges the release PR). Step-level env is evaluated even
          # when `if:` is falsy, so calling fromJson('') here fails the whole job
          # with "Error reading JToken from JsonReader". Short-circuit on the
          # empty string so fromJson only runs when there's actually a PR.
          PR_BRANCH: ${{ steps.release-please.outputs.pr && fromJson(steps.release-please.outputs.pr).headBranchName || '' }}
        run: |
          set -euo pipefail
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"
          uv lock --directory mcp
          if git diff --quiet -- mcp/uv.lock; then
            echo "uv.lock already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "gs1belu-release-please[bot]"
          git config user.email "gs1belu-release-please[bot]@users.noreply.github.com"
          git add mcp/uv.lock
          git commit -m "chore(mcp): sync uv.lock with release version bump"
          git push origin "$PR_BRANCH"
