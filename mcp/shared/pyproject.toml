[project]
name = "gs1belu-mpm-mcp-shared"
version = "0.0.0"
description = "Dev-only OAuth/rate-limit/sunset/error-mapping code shared by the Upload and Download MCP servers. Vendored byte-identically into each of their wheels at build time (map #76) — never published on its own."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "fastmcp>=3.4,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
