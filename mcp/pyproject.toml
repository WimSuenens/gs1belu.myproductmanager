# Virtual uv workspace root (dev-only, non-publishable — map #76). Members:
#
#   shared/    dev-only OAuth/rate-limit/sunset/error-mapping code, vendored
#              byte-identically into upload/ and download/'s wheels at build time.
#              Never published on its own.
#   upload/    gs1belu-mpm-upload-mcp — the provider-role MCP server.
#   download/  gs1belu-mpm-download-mcp — the recipient-role MCP server.
#   combined/  gs1belu-mpm-mcp — the deprecated predecessor (#82), kept until its
#              final 0.4.0 release ships.
#
# One shared `.venv`/`uv.lock` here covers all four; `just test-mcp` runs each
# member's own test suite against it.
[tool.uv.workspace]
members = ["shared", "upload", "download", "combined"]
