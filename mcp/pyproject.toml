[project]
name = "gs1belu-mpm-mcp"
version = "0.2.2"
description = "FastMCP server exposing GS1 Belgium & Luxembourg My Product Manager (Upload + Download v17) as a small, agent-safe MCP tool surface."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Wim Suenens" },
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.28,<1",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/WimSuenens/gs1belu.myproductmanager"
Repository = "https://github.com/WimSuenens/gs1belu.myproductmanager"
Issues = "https://github.com/WimSuenens/gs1belu.myproductmanager/issues"

[project.scripts]
gs1belu-mpm-mcp = "gs1belu_mpm_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gs1belu_mpm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
